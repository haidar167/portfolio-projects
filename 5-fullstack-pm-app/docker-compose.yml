version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pmapp
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: pmapp_db
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://pmapp:password123@db:5432/pmapp_db
      JWT_SECRET: your_jwt_secret_key
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend