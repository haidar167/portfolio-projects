<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analytics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .dashboard { background: white; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 30px; }
        .metric-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .metric-value { font-size: 2em; font-weight: bold; }
        .metric-label { font-size: 0.9em; opacity: 0.9; }
        .chart-container { position: relative; height: 400px; margin-bottom: 30px; }
        h1 { color: #333; margin-bottom: 30px; font-weight: bold; }
        h3 { color: #555; margin-top: 30px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="dashboard">
            <h1>📊 Sales Analytics Dashboard</h1>
            
            <div class="row" id="metricsContainer"></div>
            
            <h3>Revenue Trend</h3>
            <div class="chart-container">
                <canvas id="revenueChart"></canvas>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <h3>Sales by Region</h3>
                    <div class="chart-container">
                        <canvas id="regionChart"></canvas>
                    </div>
                </div>
                <div class="col-md-6">
                    <h3>Top Products</h3>
                    <div class="chart-container">
                        <canvas id="productsChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <a href="/api/export" class="btn btn-primary">📥 Export to CSV</a>
            </div>
        </div>
    </div>

    <script>
        // Load metrics
        fetch('/api/metrics')
            .then(r => r.json())
            .then(data => {
                const html = `
                    <div class="col-md-3"><div class="metric-card"><div class="metric-value">$${data.total_revenue.toLocaleString()}</div><div class="metric-label">Total Revenue</div></div></div>
                    <div class="col-md-3"><div class="metric-card"><div class="metric-value">${data.total_sales}</div><div class="metric-label">Total Sales</div></div></div>
                    <div class="col-md-3"><div class="metric-card"><div class="metric-value">$${data.avg_order_value.toFixed(2)}</div><div class="metric-label">Avg Order Value</div></div></div>
                    <div class="col-md-3"><div class="metric-card"><div class="metric-value">${data.unique_customers}</div><div class="metric-label">Unique Customers</div></div></div>
                `;
                document.getElementById('metricsContainer').innerHTML = html;
            });
        
        // Revenue Chart
        fetch('/api/sales-by-date')
            .then(r => r.json())
            .then(data => {
                new Chart(document.getElementById('revenueChart'), {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Daily Revenue',
                            data: data.data,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            });
        
        // Region Chart
        fetch('/api/sales-by-region')
            .then(r => r.json())
            .then(data => {
                new Chart(document.getElementById('regionChart'), {
                    type: 'doughnut',
                    data: {
                        labels: data.labels,
                        datasets: [{ data: data.data, backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            });
        
        // Products Chart
        fetch('/api/top-products')
            .then(r => r.json())
            .then(data => {
                new Chart(document.getElementById('productsChart'), {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{ label: 'Revenue', data: data.data, backgroundColor: '#667eea' }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            });
    </script>
</body>
</html>
